{% extends 'base.html' %}

{% block title %}Detalle de mascota - Pets Alert{% endblock %}

{% block extra_head %}
<style>
    .navbar {
        display: none;
    }

    main {
        padding: 0;
        max-width: none;
        margin: 0;
    }
</style>
{% endblock %}

{% block bottom_nav %}{% endblock %}

{% block content %}
<div class="pet-detail-page">
    <header class="pet-detail-appbar">
        <button type="button" class="pet-detail-back-button" id="back-button" aria-label="Regresar">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 id="pet-detail-title">Detalle de mascota</h1>
        <div class="pet-detail-appbar-spacer"></div>
    </header>

    <div id="detail-container" class="pet-detail-container">
        <div class="pet-detail-loading">
            <div class="pet-detail-spinner"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const { api, escaparHtml } = window.PetsAlert;

        const API_DETALLE = "{% url 'report-detail' pk=reporte_id %}";
        const CHAT_API = "{% url 'chat-list' %}";
        const SALA_URL = "{% url 'chat_room_screen' chat_id=0 %}";
        const LOGUEADO = {{ user.is_authenticated|yesno:"true,false" }};

        const container = document.getElementById('detail-container');
        const title = document.getElementById('pet-detail-title');
        const backButton = document.getElementById('back-button');

        function mostrarError(mensaje) {
            container.innerHTML = `
                <div class="pet-detail-message">
                    ${escaparHtml(mensaje)}
                </div>
            `;
        }

        backButton.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "{% url 'feed_screen' %}";
            }
        });

        function campo(etiqueta, valor) {
            return `
                <div class="pet-detail-field">
                    ${escaparHtml(etiqueta)}: ${escaparHtml(valor)}
                </div>

                <div class="pet-detail-spacer-tiny"></div>
            `;
        }

        async function cargarDetalle() {
            try {
                const reporte = await api(API_DETALLE);

                const especie = reporte.species_display || 'Otro';
                const nombre = (reporte.name || '').trim();

                title.textContent = nombre !== '' ? nombre : 'Detalle de mascota';

                let textoReporte = reporte.status === 'ENCONTRADO' ? 'ENCONTRADO' : 'SE BUSCA';

                if (reporte.is_resolved) {
                    textoReporte += ' (RESUELTO)';
                }

                const imagenHtml = reporte.image
                    ? `
                        <div class="pet-detail-image-wrapper">
                            <img
                                src="${escaparHtml(reporte.image)}"
                                class="pet-detail-image-background"
                                alt=""
                            >
                            <div class="pet-detail-image-overlay"></div>
                            <img
                                src="${escaparHtml(reporte.image)}"
                                class="pet-detail-image-main"
                                alt="${escaparHtml(especie)}"
                            >
                        </div>
                    `
                    : `
                        <div class="pet-detail-no-image">
                            <span class="material-symbols-outlined">pets</span>
                        </div>
                    `;

                const botonChat = reporte.is_mine
                    ? ''
                    : `
                        <div class="pet-detail-spacer-large"></div>

                        <button type="button" class="pet-detail-chat-button" id="chat-button">
                            <span class="pet-detail-chat-icon material-symbols-outlined">chat</span>
                            <span>Contactar por Chat</span>
                        </button>
                    `;

                container.innerHTML = `
                    ${imagenHtml}

                    <div class="pet-detail-body">
                        <div class="pet-detail-report-type">
                            Reporte: ${escaparHtml(textoReporte)}
                        </div>

                        <div class="pet-detail-spacer-small"></div>

                        ${campo('Especie', especie)}
                        ${reporte.breed ? campo('Raza', reporte.breed) : ''}
                        ${reporte.color ? campo('Color', reporte.color) : ''}
                        ${campo('Localidad', reporte.last_seen_location || '')}

                        <div class="pet-detail-spacer-medium"></div>

                        <div class="pet-detail-description-title">
                            Descripción:
                        </div>

                        <div class="pet-detail-spacer-tiny"></div>

                        <div class="pet-detail-description">
                            ${escaparHtml(reporte.description || '')}
                        </div>

                        ${botonChat}
                    </div>
                `;

                const renderedImage = container.querySelector('.pet-detail-image-main');

                if (renderedImage) {
                    renderedImage.addEventListener('error', () => {
                        const wrapper = renderedImage.closest('.pet-detail-image-wrapper');

                        if (wrapper) {
                            wrapper.innerHTML = `
                                <div class="pet-detail-no-image">
                                    <span class="material-symbols-outlined">pets</span>
                                </div>
                            `;
                        }
                    });
                }

                const chatButton = document.getElementById('chat-button');

                if (chatButton) {
                    chatButton.addEventListener('click', async () => {
                        if (!LOGUEADO) {
                            window.location.href =
                                "{% url 'login' %}?next=" + encodeURIComponent(window.location.pathname);
                            return;
                        }

                        chatButton.disabled = true;

                        try {
                            // Abre el chat de este reporte, o recupera el que ya existe.
                            const chat = await api(CHAT_API, {
                                method: 'POST',
                                body: { report: reporte.id }
                            });

                            window.location.href = SALA_URL.replace('/0/', `/${chat.id}/`);
                        } catch (error) {
                            console.error(error);
                            chatButton.disabled = false;
                            window.alert(error.message);
                        }
                    });
                }
            } catch (error) {
                console.error(error);
                mostrarError(error.status === 404 ? 'El reporte no existe.' : 'Error al cargar el reporte.');
            }
        }

        cargarDetalle();
    })();
</script>
{% endblock %}
