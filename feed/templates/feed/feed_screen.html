{% extends 'base.html' %}

{% block title %}Feed - Pets Alert{% endblock %}

{% block extra_head %}
<style>
    .navbar {
        display: none;
    }

    main {
        padding: 0;
        max-width: none;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="feed-page">
    <header class="feed-appbar">
        <div class="feed-appbar-title">
            <span class="feed-paw material-symbols-outlined">pets</span>
            <span>Pets Alert</span>
        </div>

        <button type="button" class="feed-search-button" aria-label="Buscar">
            <span class="material-symbols-outlined">search</span>
        </button>
    </header>

    <div class="feed-filters-wrapper">
        <div id="feed-filters" class="feed-filters"></div>
    </div>

    <div class="feed-content">
        <div id="feed-container" class="feed-grid">
            <div class="feed-loading">
                <div class="feed-spinner"></div>
            </div>
        </div>

        <div id="feed-more-wrapper" style="text-align: center; padding: 16px 0;" hidden>
            <button type="button" id="feed-more" class="feed-filter-chip">Cargar más</button>
        </div>
    </div>

    <a href="{% url 'add_report_screen' %}" class="feed-report-button">
        <span class="feed-report-icon">+</span>
        <span>Reportar</span>
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const { api, escaparHtml } = window.PetsAlert;

        const API_REPORTES = "{% url 'report-list' %}";
        const DETALLE_URL = "{% url 'pet_detail_screen' pk=0 %}";

        const feedContainer = document.getElementById('feed-container');
        const filtersContainer = document.getElementById('feed-filters');
        const moreWrapper = document.getElementById('feed-more-wrapper');
        const moreButton = document.getElementById('feed-more');

        const categorias = [
            { etiqueta: 'Todos', valor: '' },
            { etiqueta: 'Perro', valor: 'PERRO' },
            { etiqueta: 'Gato', valor: 'GATO' },
            { etiqueta: 'Ave', valor: 'AVE' },
            { etiqueta: 'Conejo', valor: 'CONEJO' },
            { etiqueta: 'Otro', valor: 'OTRO' }
        ];

        let filtroSeleccionado = '';
        let reportes = [];
        let urlSiguiente = null;
        let numeroSolicitud = 0;

        function renderizarFiltros() {
            filtersContainer.innerHTML = '';

            categorias.forEach(categoria => {
                const button = document.createElement('button');

                button.type = 'button';
                button.className = 'feed-filter-chip';
                button.textContent = categoria.etiqueta;

                if (categoria.valor === filtroSeleccionado) {
                    button.classList.add('selected');
                }

                button.addEventListener('click', () => {
                    filtroSeleccionado = categoria.valor;
                    renderizarFiltros();
                    cargar({ reiniciar: true });
                });

                filtersContainer.appendChild(button);
            });
        }

        function crearTarjeta(reporte) {
            const encontrado = reporte.status === 'ENCONTRADO';
            const especie = reporte.species_display || 'Desconocida';
            const localidad = reporte.last_seen_location || 'Sin ubicación';
            const descripcion = reporte.description || 'Sin descripción';

            const card = document.createElement('a');
            card.className = 'pet-card';
            card.href = DETALLE_URL.replace('/0/', `/${reporte.id}/`);

            card.innerHTML = `
                <div class="pet-image-container">
                    ${reporte.image
                        ? `<img src="${escaparHtml(reporte.image)}" alt="Foto de ${escaparHtml(especie)}">`
                        : `<div class="pet-placeholder"><span class="material-symbols-outlined">pets</span></div>`
                    }
                </div>

                <div class="status-bar ${encontrado ? 'status-encontrada' : 'status-buscada'}">
                    ${encontrado ? 'ENCONTRADO' : 'SE BUSCA'}
                </div>

                <div class="pet-info">
                    <h3 class="pet-species">${escaparHtml(especie)}</h3>
                    <p class="pet-location">${escaparHtml(localidad)}</p>
                    <p class="pet-description">${escaparHtml(descripcion)}</p>
                </div>
            `;

            const image = card.querySelector('img');

            if (image) {
                image.addEventListener('error', () => {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'pet-placeholder';
                    placeholder.innerHTML = '<span class="material-symbols-outlined">pets</span>';
                    image.replaceWith(placeholder);
                });
            }

            return card;
        }

        function renderizar() {
            if (reportes.length === 0) {
                const categoria = categorias.find(item => item.valor === filtroSeleccionado);

                feedContainer.innerHTML = filtroSeleccionado === ''
                    ? `
                        <div class="feed-empty">
                            <p>No hay reportes activos.</p>
                            <p>¡Sé el primero en publicar!</p>
                        </div>
                    `
                    : `
                        <div class="feed-empty">
                            <p>No hay reportes de ${escaparHtml(categoria.etiqueta)} en este momento.</p>
                        </div>
                    `;
                return;
            }

            feedContainer.innerHTML = '';
            reportes.forEach(reporte => feedContainer.appendChild(crearTarjeta(reporte)));
        }

        async function cargar({ reiniciar }) {
            const solicitud = ++numeroSolicitud;
            let url;

            if (reiniciar) {
                reportes = [];
                urlSiguiente = null;
                moreWrapper.hidden = true;
                feedContainer.innerHTML = '<div class="feed-loading"><div class="feed-spinner"></div></div>';

                url = filtroSeleccionado
                    ? `${API_REPORTES}?species=${encodeURIComponent(filtroSeleccionado)}`
                    : API_REPORTES;
            } else {
                url = urlSiguiente;
            }

            if (!url) {
                return;
            }

            moreButton.disabled = true;

            try {
                const datos = await api(url);

                // Si mientras tanto se cambió de filtro, esta respuesta ya no sirve.
                if (solicitud !== numeroSolicitud) {
                    return;
                }

                reportes = reportes.concat(datos.results);
                urlSiguiente = datos.next;

                renderizar();
                moreWrapper.hidden = !urlSiguiente;
            } catch (error) {
                if (solicitud !== numeroSolicitud) {
                    return;
                }

                console.error(error);

                if (reportes.length === 0) {
                    feedContainer.innerHTML = `
                        <div class="feed-error">
                            Error al cargar las publicaciones.
                        </div>
                    `;
                }
            } finally {
                if (solicitud === numeroSolicitud) {
                    moreButton.disabled = false;
                }
            }
        }

        moreButton.addEventListener('click', () => cargar({ reiniciar: false }));

        // Al volver con el botón "atrás" se refresca la lista.
        window.addEventListener('pageshow', event => {
            if (event.persisted) {
                cargar({ reiniciar: true });
            }
        });

        renderizarFiltros();
        cargar({ reiniciar: true });
    })();
</script>
{% endblock %}
