{% extends 'base.html' %}

{% block title %}Pets Alert{% endblock %}

{% block extra_head %}
<style>
    .navbar {
        display: none;
    }

    main {
        padding: 0;
        max-width: none;
        margin: 0;
    }
</style>
{% endblock %}

{% block bottom_nav %}{% endblock %}

{% block content %}
<div class="add-report-page">
    <header class="add-report-appbar">
        <button type="button" class="add-report-back-button" id="back-button" aria-label="Regresar">
            <span>‹</span>
        </button>
        <h1 id="screen-title">Crear Reporte</h1>
        <div class="add-report-appbar-spacer"></div>
    </header>

    <div class="add-report-container">
        <form id="report-form" novalidate>
            <h2>Información de la mascota</h2>

            <div class="report-type-row">
                <button type="button" class="report-type-button lost" id="lost-button">
                    SE BUSCA
                </button>

                <button type="button" class="report-type-button found" id="found-button">
                    ENCONTRADO
                </button>
            </div>

            <input
                type="file"
                id="image-input"
                accept="image/*"
                hidden
            >

            <button type="button" id="image-picker" class="image-picker">
                <div id="image-preview" class="image-preview">
                    <span class="image-placeholder-icon">📷</span>
                    <span class="image-placeholder-text">Toca para subir foto</span>
                </div>
            </button>

            <div class="form-group">
                <label for="especie">Especie</label>
                <select id="especie" required>
                    <option value="PERRO">Perro</option>
                    <option value="GATO">Gato</option>
                    <option value="AVE">Ave</option>
                    <option value="CONEJO">Conejo</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre (opcional)</label>
                <input type="text" id="nombre" maxlength="100" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="raza">Raza (opcional)</label>
                <input type="text" id="raza" maxlength="100" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="color">Color predominante (opcional)</label>
                <input type="text" id="color" maxlength="50" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="localidad">Ubicación / Localidad</label>
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">location_on</span>
                    <input
                        type="text"
                        id="localidad"
                        maxlength="255"
                        required
                    >
                </div>
                <div class="field-error" id="localidad-error"></div>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción y señas particulares</label>
                <textarea
                    id="descripcion"
                    rows="4"
                    required
                ></textarea>
                <div class="field-error" id="descripcion-error"></div>
            </div>

            <div class="form-error" id="form-error"></div>

            <button type="submit" id="submit-button" class="submit-button">
                Publicar Reporte
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const { api } = window.PetsAlert;

        const reporteId = "{{ reporte_id|default:'' }}";
        const isEditing = reporteId !== "";

        const API_REPORTES = "{% url 'report-list' %}";
        const API_REPORTE = "{% if reporte_id %}{% url 'report-detail' pk=reporte_id %}{% endif %}";

        const form = document.getElementById('report-form');
        const screenTitle = document.getElementById('screen-title');
        const lostButton = document.getElementById('lost-button');
        const foundButton = document.getElementById('found-button');
        const imageInput = document.getElementById('image-input');
        const imagePicker = document.getElementById('image-picker');
        const imagePreview = document.getElementById('image-preview');
        const especieInput = document.getElementById('especie');
        const nombreInput = document.getElementById('nombre');
        const razaInput = document.getElementById('raza');
        const colorInput = document.getElementById('color');
        const localidadInput = document.getElementById('localidad');
        const descripcionInput = document.getElementById('descripcion');
        const submitButton = document.getElementById('submit-button');
        const formError = document.getElementById('form-error');
        const localidadError = document.getElementById('localidad-error');
        const descripcionError = document.getElementById('descripcion-error');
        const backButton = document.getElementById('back-button');

        const PLACEHOLDER_FOTO = `
            <span class="image-placeholder-icon">📷</span>
            <span class="image-placeholder-text">Toca para subir foto</span>
        `;

        let tipoReporte = 'PERDIDO';
        let imagenSeleccionada = null;
        let tieneImagenExistente = false;
        let urlPreview = null;

        function actualizarTipoReporte() {
            lostButton.classList.toggle('selected', tipoReporte === 'PERDIDO');
            foundButton.classList.toggle('selected', tipoReporte === 'ENCONTRADO');
        }

        function limpiarErrores() {
            formError.textContent = '';
            localidadError.textContent = '';
            descripcionError.textContent = '';
        }

        function mostrarErrorGeneral(mensaje) {
            formError.textContent = mensaje;
        }

        function mostrarPreview(src) {
            if (!src) {
                imagePreview.innerHTML = PLACEHOLDER_FOTO;
                return;
            }

            imagePreview.innerHTML = '<img alt="Vista previa de mascota">';

            const image = imagePreview.querySelector('img');
            image.addEventListener('error', () => {
                imagePreview.innerHTML = PLACEHOLDER_FOTO;
            });
            image.src = src;
        }

        // Reduce la foto (máx. 1280 px, JPEG) antes de subirla para que pese poco.
        function comprimirImagen(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();

                img.onload = () => {
                    URL.revokeObjectURL(url);

                    const maxLado = 1280;
                    const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
                    const width = Math.round(img.width * escala);
                    const height = Math.round(img.height * escala);

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const context = canvas.getContext('2d');

                    if (!context) {
                        reject(new Error('No se pudo procesar la imagen.'));
                        return;
                    }

                    context.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(blob => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('No se pudo procesar la imagen.'));
                        }
                    }, 'image/jpeg', 0.8);
                };

                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('No se pudo leer la imagen.'));
                };

                img.src = url;
            });
        }

        async function procesarImagen() {
            const file = imageInput.files && imageInput.files[0];

            if (!file) {
                return;
            }

            try {
                const blob = await comprimirImagen(file);

                if (urlPreview) {
                    URL.revokeObjectURL(urlPreview);
                }

                imagenSeleccionada = blob;
                urlPreview = URL.createObjectURL(blob);
                mostrarPreview(urlPreview);
            } catch (error) {
                console.error(error);
                mostrarErrorGeneral('No se pudo procesar la imagen.');
            }
        }

        async function cargarReporteExistente() {
            try {
                const reporte = await api(API_REPORTE);

                tipoReporte = reporte.status || 'PERDIDO';
                especieInput.value = reporte.species || 'OTRO';
                nombreInput.value = reporte.name || '';
                razaInput.value = reporte.breed || '';
                colorInput.value = reporte.color || '';
                localidadInput.value = reporte.last_seen_location || '';
                descripcionInput.value = reporte.description || '';

                actualizarTipoReporte();

                if (reporte.image) {
                    tieneImagenExistente = true;
                    mostrarPreview(reporte.image);
                }
            } catch (error) {
                console.error(error);
                mostrarErrorGeneral(
                    error.status === 404 ? 'El reporte no existe.' : 'Error al cargar el reporte.'
                );
                submitButton.disabled = true;
            }
        }

        function actualizarInterfazEdicion() {
            if (isEditing) {
                screenTitle.textContent = 'Editar Reporte';
                submitButton.textContent = 'Guardar Cambios';
            } else {
                screenTitle.textContent = 'Crear Reporte';
                submitButton.textContent = 'Publicar Reporte';
            }
        }

        function validarFormulario() {
            limpiarErrores();

            let valido = true;

            if (!localidadInput.value.trim()) {
                localidadError.textContent = 'Requerido';
                valido = false;
            }

            if (!descripcionInput.value.trim()) {
                descripcionError.textContent = 'Requerido';
                valido = false;
            }

            if (!imagenSeleccionada && !tieneImagenExistente) {
                mostrarErrorGeneral('Por favor, selecciona una foto de la mascota.');
                valido = false;
            }

            return valido;
        }

        function bloquearFormulario(bloquear) {
            submitButton.disabled = bloquear;
            lostButton.disabled = bloquear;
            foundButton.disabled = bloquear;
            imagePicker.disabled = bloquear;
            especieInput.disabled = bloquear;
            nombreInput.disabled = bloquear;
            razaInput.disabled = bloquear;
            colorInput.disabled = bloquear;
            localidadInput.disabled = bloquear;
            descripcionInput.disabled = bloquear;

            if (bloquear) {
                submitButton.innerHTML = '<span class="submit-spinner"></span>';
            } else {
                submitButton.textContent = isEditing ? 'Guardar Cambios' : 'Publicar Reporte';
            }
        }

        function mostrarErroresDeApi(error) {
            const datos = error.datos;
            const generales = [];

            if (datos && typeof datos === 'object' && typeof datos.detail !== 'string') {
                for (const [campo, mensajes] of Object.entries(datos)) {
                    const texto = [].concat(mensajes).join(' ');

                    if (campo === 'description') {
                        descripcionError.textContent = texto;
                    } else if (campo === 'last_seen_location') {
                        localidadError.textContent = texto;
                    } else {
                        generales.push(texto);
                    }
                }
            } else {
                generales.push(error.message);
            }

            mostrarErrorGeneral(generales.join(' '));
        }

        async function enviarReporte() {
            if (!validarFormulario()) {
                return;
            }

            bloquearFormulario(true);

            try {
                const datos = new FormData();

                datos.append('status', tipoReporte);
                datos.append('species', especieInput.value);
                datos.append('name', nombreInput.value.trim());
                datos.append('breed', razaInput.value.trim());
                datos.append('color', colorInput.value.trim());
                datos.append('description', descripcionInput.value.trim());
                datos.append('last_seen_location', localidadInput.value.trim());

                if (imagenSeleccionada) {
                    datos.append('image', imagenSeleccionada, 'foto.jpg');
                }

                if (isEditing) {
                    await api(API_REPORTE, { method: 'PATCH', formData: datos });
                } else {
                    await api(API_REPORTES, { method: 'POST', formData: datos });
                }

                sessionStorage.setItem(
                    'petsAlertMessage',
                    isEditing ? '✅ Reporte actualizado' : '✅ Reporte publicado con éxito'
                );

                window.location.href = "{% url 'feed_screen' %}";
            } catch (error) {
                console.error(error);
                mostrarErroresDeApi(error);
                bloquearFormulario(false);
            }
        }

        lostButton.addEventListener('click', () => {
            tipoReporte = 'PERDIDO';
            actualizarTipoReporte();
        });

        foundButton.addEventListener('click', () => {
            tipoReporte = 'ENCONTRADO';
            actualizarTipoReporte();
        });

        imagePicker.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', procesarImagen);

        backButton.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "{% url 'feed_screen' %}";
            }
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            enviarReporte();
        });

        actualizarTipoReporte();
        actualizarInterfazEdicion();

        if (isEditing) {
            cargarReporteExistente();
        }
    })();
</script>
{% endblock %}
