{% extends 'base.html' %}

{% block title %}Chat - Pets Alert{% endblock %}

{% block bottom_nav %}{% endblock %}

{% block extra_head %}
<style>
    main {
        padding: 0;
        max-width: none;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-room-page">
    <header class="chat-room-appbar">
        <button type="button" id="chat-back-button" class="chat-room-back" aria-label="Regresar">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 id="chat-room-title">{{ otro_usuario.nombre }}</h1>
        <a
            href="{% url 'pet_detail_screen' pk=chat.report_id %}"
            class="chat-room-back"
            aria-label="Ver reporte"
            style="display: flex; align-items: center; justify-content: center; text-decoration: none;"
        >
            <span class="material-symbols-outlined">pets</span>
        </a>
    </header>

    <div id="messages" class="chat-messages">
        <div class="chat-room-loading">
            <div class="chat-spinner"></div>
        </div>
    </div>

    <form id="message-form" class="chat-input-bar">
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." maxlength="2000" autocomplete="off">
        <button type="submit" class="chat-send-button" aria-label="Enviar">
            <span class="material-symbols-outlined">send</span>
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const { api, escaparHtml } = window.PetsAlert;

        const API_MENSAJES = "{% url 'chat-messages' pk=chat.id %}";
        const INTERVALO_MS = 3000;

        const messagesContainer = document.getElementById('messages');
        const form = document.getElementById('message-form');
        const input = document.getElementById('message-input');
        const backButton = document.getElementById('chat-back-button');

        const idsMostrados = new Set();
        let ultimoId = 0;
        let consultando = false;
        let primeraCarga = true;

        function mostrarEstado(texto) {
            messagesContainer.innerHTML = `<div class="chat-room-message-state">${escaparHtml(texto)}</div>`;
        }

        function estaAlFinal() {
            return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 80;
        }

        function crearBurbuja(mensaje) {
            const fila = document.createElement('div');
            fila.className = `chat-bubble-row ${mensaje.is_mine ? 'mine' : 'theirs'}`;
            fila.innerHTML = `
                <div class="chat-bubble ${mensaje.is_mine ? 'mine' : 'theirs'}">
                    ${escaparHtml(mensaje.content)}
                </div>
            `;
            return fila;
        }

        function agregarMensajes(mensajes) {
            const nuevos = mensajes.filter(mensaje => !idsMostrados.has(mensaje.id));

            if (nuevos.length === 0) {
                return;
            }

            if (idsMostrados.size === 0) {
                messagesContainer.innerHTML = '';
            }

            const bajar = primeraCarga || estaAlFinal() || nuevos.some(mensaje => mensaje.is_mine);

            nuevos.forEach(mensaje => {
                idsMostrados.add(mensaje.id);
                ultimoId = Math.max(ultimoId, mensaje.id);
                messagesContainer.appendChild(crearBurbuja(mensaje));
            });

            if (bajar) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        async function consultarMensajes() {
            if (consultando) {
                return;
            }

            consultando = true;

            try {
                const url = ultimoId > 0 ? `${API_MENSAJES}?after=${ultimoId}` : API_MENSAJES;
                const mensajes = await api(url);

                agregarMensajes(mensajes);

                if (primeraCarga && mensajes.length === 0) {
                    mostrarEstado('No hay mensajes aún. Escribe el primero.');
                }

                primeraCarga = false;
            } catch (error) {
                console.error(error);

                if (primeraCarga) {
                    mostrarEstado('Error al cargar mensajes');
                }
            } finally {
                consultando = false;
            }
        }

        backButton.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "{% url 'chat_list_screen' %}";
            }
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();

            const contenido = input.value.trim();

            if (!contenido) {
                return;
            }

            input.disabled = true;

            try {
                const mensaje = await api(API_MENSAJES, {
                    method: 'POST',
                    body: { content: contenido }
                });

                input.value = '';
                primeraCarga = false;
                agregarMensajes([mensaje]);
            } catch (error) {
                console.error(error);
                window.alert(error.message);
            } finally {
                input.disabled = false;
                input.focus();
            }
        });

        setInterval(() => {
            if (document.visibilityState === 'visible') {
                consultarMensajes();
            }
        }, INTERVALO_MS);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                consultarMensajes();
            }
        });

        consultarMensajes();
    })();
</script>
{% endblock %}
