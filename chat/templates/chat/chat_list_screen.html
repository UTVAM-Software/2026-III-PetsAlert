{% extends 'base.html' %}

{% block title %}Mensajes - Pets Alert{% endblock %}

{% block extra_head %}
<style>
    main {
        padding: 0;
        max-width: none;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-list-page">
    <header class="chat-appbar">
        <h1>Mensajes</h1>
    </header>

    <div id="chat-list" class="chat-list-content">
        <div class="chat-loading">
            <div class="chat-spinner"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const { api, escaparHtml } = window.PetsAlert;

        const API_CHATS = "{% url 'chat-list' %}";
        const SALA_URL = "{% url 'chat_room_screen' chat_id=0 %}";
        const INTERVALO_MS = 10000;

        const list = document.getElementById('chat-list');

        function formatearFecha(iso) {
            if (!iso) {
                return '';
            }

            const fecha = new Date(iso);

            if (Number.isNaN(fecha.getTime())) {
                return '';
            }

            const hoy = new Date();
            const esHoy = fecha.toDateString() === hoy.toDateString();

            return esHoy
                ? fecha.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })
                : fecha.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' });
        }

        function mostrarVacio() {
            list.innerHTML = `
                <div class="chat-empty">
                    Aún no tienes conversaciones.
                </div>
            `;
        }

        function mostrarError() {
            list.innerHTML = `
                <div class="chat-error">
                    Error al cargar los mensajes.
                </div>
            `;
        }

        function renderizarChats(chats) {
            if (chats.length === 0) {
                mostrarVacio();
                return;
            }

            list.innerHTML = '';

            chats.forEach(chat => {
                const nombre = chat.other_user.nombre || 'Usuario';
                const reporte = chat.report;
                const contexto = `${reporte.species_display} · ${reporte.last_seen_location}`;

                let ultimo = 'Aún no hay mensajes';

                if (chat.last_message) {
                    ultimo = (chat.last_message.is_mine ? 'Tú: ' : '') + chat.last_message.content;
                }

                const noLeidos = chat.unread_count > 0
                    ? `<span style="display:inline-block;min-width:20px;padding:2px 6px;border-radius:10px;background:var(--primary-color);color:#fff;font-size:12px;font-weight:700;text-align:center;">${chat.unread_count}</span>`
                    : '';

                const tile = document.createElement('a');
                tile.className = 'chat-tile';
                tile.href = SALA_URL.replace('/0/', `/${chat.id}/`);
                tile.innerHTML = `
                    <div class="chat-avatar">${escaparHtml(nombre.charAt(0).toUpperCase())}</div>
                    <div class="chat-tile-body">
                        <div class="chat-tile-title">${escaparHtml(nombre)}</div>
                        <div class="chat-tile-subtitle" style="font-size:12px;opacity:0.7;">${escaparHtml(contexto)}</div>
                        <div class="chat-tile-subtitle">${escaparHtml(ultimo)}</div>
                    </div>
                    <div class="chat-tile-time">
                        ${escaparHtml(formatearFecha(chat.last_message ? chat.last_message.created_at : chat.created_at))}
                        <div>${noLeidos}</div>
                    </div>
                `;

                list.appendChild(tile);
            });
        }

        async function cargarChats() {
            try {
                renderizarChats(await api(API_CHATS));
            } catch (error) {
                console.error(error);

                if (error.status === 401 || error.status === 403) {
                    window.location.href = "{% url 'login' %}?next=" + encodeURIComponent(window.location.pathname);
                    return;
                }

                if (!list.querySelector('.chat-tile')) {
                    mostrarError();
                }
            }
        }

        setInterval(() => {
            if (document.visibilityState === 'visible') {
                cargarChats();
            }
        }, INTERVALO_MS);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                cargarChats();
            }
        });

        window.addEventListener('pageshow', event => {
            if (event.persisted) {
                cargarChats();
            }
        });

        cargarChats();
    })();
</script>
{% endblock %}
