{% extends 'base.html' %}

{% block title %}Mis Reportes - Pets Alert{% endblock %}

{% block extra_head %}
<style>
    main {
        padding: 0;
        max-width: none;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="my-reports-page">
    <header class="my-reports-appbar">
        <h1>Mis Reportes</h1>
    </header>

    <div id="reports-container" class="my-reports-content">
        <div class="my-reports-loading">
            <div class="my-reports-spinner"></div>
        </div>
    </div>
</div>

<div class="confirm-modal-backdrop" id="delete-modal" hidden>
    <div class="confirm-modal" role="dialog" aria-modal="true">
        <h2>¿Eliminar reporte?</h2>
        <p>Esta acción no se puede deshacer.</p>
        <div class="confirm-modal-actions">
            <button type="button" id="delete-cancel">Cancelar</button>
            <button type="button" id="delete-confirm">Eliminar</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const { api, escaparHtml } = window.PetsAlert;

        const API_REPORTES = "{% url 'report-list' %}";
        const API_MIS_REPORTES = "{% url 'report-mine' %}";
        const EDITAR_URL = "{% url 'edit_report_screen' pk=0 %}";
        const DETALLE_URL = "{% url 'pet_detail_screen' pk=0 %}";

        const container = document.getElementById('reports-container');

        const deleteModal = document.getElementById('delete-modal');
        const deleteCancel = document.getElementById('delete-cancel');
        const deleteConfirm = document.getElementById('delete-confirm');
        let reportToDelete = null;

        function mostrarEstado(texto, clase = '') {
            container.innerHTML = `<div class="my-reports-message ${clase}">${escaparHtml(texto)}</div>`;
        }

        function etiquetaEstado(reporte) {
            if (reporte.is_resolved) {
                return { texto: 'RESUELTO', clase: 'found' };
            }

            return reporte.status === 'ENCONTRADO'
                ? { texto: 'ENCONTRADO', clase: 'found' }
                : { texto: 'SE BUSCA', clase: 'lost' };
        }

        function renderizarReportes(reportes) {
            if (reportes.length === 0) {
                mostrarEstado('No has creado ningún reporte aún.');
                return;
            }

            container.innerHTML = '';

            reportes.forEach(reporte => {
                const etiqueta = etiquetaEstado(reporte);
                const especie = reporte.species_display || 'Desconocida';

                const card = document.createElement('article');
                card.className = 'my-report-card';

                card.innerHTML = `
                    <div class="my-report-main">
                        <div class="my-report-image">
                            ${reporte.image
                                ? `<img src="${escaparHtml(reporte.image)}" alt="${escaparHtml(especie)}">`
                                : `<span class="material-symbols-outlined">pets</span>`
                            }
                        </div>
                        <div class="my-report-info">
                            <h2>${escaparHtml(especie)}</h2>
                            <p>${escaparHtml(reporte.last_seen_location || 'Sin ubicación')}</p>
                        </div>
                        <span class="my-report-status ${etiqueta.clase}">${etiqueta.texto}</span>
                    </div>
                    <div class="my-report-actions">
                        ${reporte.can_edit ? `
                            <button type="button" class="my-report-edit" data-action="resolver">
                                <span class="material-symbols-outlined">${reporte.is_resolved ? 'undo' : 'task_alt'}</span>
                                <span>${reporte.is_resolved ? 'Reabrir' : 'Resuelto'}</span>
                            </button>
                            <a href="${EDITAR_URL.replace('/0/', `/${reporte.id}/`)}" class="my-report-edit">
                                <span class="material-symbols-outlined">edit</span>
                                <span>Editar</span>
                            </a>
                        ` : ''}
                        ${reporte.can_delete ? `
                            <button type="button" class="my-report-delete" data-action="borrar">
                                <span class="material-symbols-outlined">delete_outline</span>
                                <span>Borrar</span>
                            </button>
                        ` : ''}
                    </div>
                `;

                const image = card.querySelector('img');

                if (image) {
                    image.addEventListener('error', () => {
                        image.replaceWith(Object.assign(document.createElement('span'), {
                            className: 'material-symbols-outlined',
                            textContent: 'pets'
                        }));
                    });
                }

                card.querySelector('.my-report-main').addEventListener('click', () => {
                    window.location.href = DETALLE_URL.replace('/0/', `/${reporte.id}/`);
                });

                const botonResolver = card.querySelector('[data-action="resolver"]');

                if (botonResolver) {
                    botonResolver.addEventListener('click', () => cambiarResuelto(reporte, botonResolver));
                }

                const botonBorrar = card.querySelector('[data-action="borrar"]');

                if (botonBorrar) {
                    botonBorrar.addEventListener('click', () => {
                        reportToDelete = reporte.id;
                        deleteModal.hidden = false;
                    });
                }

                container.appendChild(card);
            });
        }

        async function cargarReportes() {
            try {
                const reportes = await api(API_MIS_REPORTES);
                renderizarReportes(reportes);
            } catch (error) {
                console.error(error);

                if (error.status === 401 || error.status === 403) {
                    window.location.href = "{% url 'login' %}?next=" + encodeURIComponent(window.location.pathname);
                    return;
                }

                mostrarEstado('Error al cargar tus reportes.', 'error');
            }
        }

        async function cambiarResuelto(reporte, boton) {
            boton.disabled = true;

            try {
                await api(`${API_REPORTES}${reporte.id}/`, {
                    method: 'PATCH',
                    body: { is_resolved: !reporte.is_resolved }
                });

                await cargarReportes();
            } catch (error) {
                console.error(error);
                boton.disabled = false;
                window.alert(error.message);
            }
        }

        deleteCancel.addEventListener('click', () => {
            reportToDelete = null;
            deleteModal.hidden = true;
        });

        deleteModal.addEventListener('click', event => {
            if (event.target === deleteModal) {
                reportToDelete = null;
                deleteModal.hidden = true;
            }
        });

        deleteConfirm.addEventListener('click', async () => {
            if (!reportToDelete) {
                return;
            }

            const id = reportToDelete;

            reportToDelete = null;
            deleteModal.hidden = true;
            deleteConfirm.disabled = true;

            try {
                await api(`${API_REPORTES}${id}/`, { method: 'DELETE' });
                await cargarReportes();
            } catch (error) {
                console.error(error);
                mostrarEstado(error.message || 'Error al eliminar', 'error');
            } finally {
                deleteConfirm.disabled = false;
            }
        });

        window.addEventListener('pageshow', event => {
            if (event.persisted) {
                cargarReportes();
            }
        });

        cargarReportes();
    })();
</script>
{% endblock %}
